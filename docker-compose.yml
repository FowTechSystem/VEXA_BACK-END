# Uso: copie .env.example para .env, ajuste senhas e JWT, depois:
#   docker compose up -d --build
#
# API: http://SEU_IP:8080  |  Swagger só em Development (não ativo neste compose).

services:
  api:
    build: .
    container_name: crmvexa-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-crmvaxa};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CRMVEXA}"
      Jwt__Audience: "${JWT_AUDIENCE:-CRMVEXA}"
    volumes:
      # Uploads persistentes (fotos clientes, etc.)
      - crmvexa_uploads:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: crmvexa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crmvaxa}
    ports:
      # Só localhost: migrations do PC (SSH tunnel) ou ferramentas na VPS sem expor Postgres à internet
      - "127.0.0.1:5432:5432"
    volumes:
      - crmvexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ vira $ no container — usa POSTGRES_USER / POSTGRES_DB definidos acima.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  crmvexa_pgdata:
  crmvexa_uploads:
