# Só a API (Postgres em outro lugar: Hostinger DB externo, RDS, etc.)
# Crie um .env com CONNECTION_STRING e JWT_SECRET (mín. 32 caracteres).
#
#   docker compose -f docker-compose.api-only.yml up -d --build

services:
  api:
    build: .
    container_name: crmvexa-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${CONNECTION_STRING}"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CRMVEXA}"
      Jwt__Audience: "${JWT_AUDIENCE:-CRMVEXA}"
    volumes:
      - crmvexa_uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  crmvexa_uploads:
